<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fiesta ST">
<meta name="theme-color" content="#0a0b0d">
<title>Fiesta ST Garaje</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  /* Telemetría: negro de pista, amarillo de señal, verde/ámbar/rojo para estados */
  --bg:#0a0b0d; --pn:#101215; --ln:#23272c; --ln2:#1b1e22; --tx:#f4f5f6; --mu:#7d858f;
  --ac:#ffd400; --ok:#2ee59d; --wa:#ffb21e; --bad:#ff4d3d; --blue:#4aa3ff;
  --mono:'Chakra Petch',ui-monospace,monospace; --body:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;height:var(--app-h,100dvh);overflow:hidden}
header{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
main>*,body>header,body>nav,nav{flex-shrink:0}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.35)}
.vpshort nav{padding-bottom:8px}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ln2);background:var(--bg);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px var(--mono);letter-spacing:.08em;min-height:52px;text-transform:uppercase}
nav button.on{color:var(--ac)}
button{cursor:pointer;font-family:var(--body);color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px}
.pad{padding:14px 16px}
.col{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.title{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.muted{color:var(--mu);font-size:13px;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.live i{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{font:600 11px var(--mono);letter-spacing:.08em;border-radius:6px;padding:3px 8px;border:1px solid;text-transform:uppercase;white-space:nowrap}
.alert{border:1px solid #4a3a12;background:#1f1a0d;color:var(--wa);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.err{border:1px solid #4a1d18;background:#1f0f0d;color:#ff9a8f;border-radius:12px;padding:12px 14px;font-size:14px}
.okmsg{border:1px solid #17402e;background:#0d1f17;color:#9cf2cd;border-radius:12px;padding:12px 14px;font-size:14px}
.btn{min-height:46px;border:0;border-radius:10px;font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ac);color:#0a0b0d;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.ghost{background:transparent;color:var(--ac);border:1px dashed #3a3f46}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a1d18}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1}
.li{display:grid;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln2);padding:12px 0}
.bar{height:10px;border-radius:5px;background:#1d2126;overflow:hidden}.bar>div{height:100%;border-radius:5px}
label{display:flex;flex-direction:column;gap:6px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
input{font:16px var(--body);padding:12px;border-radius:10px;border:1px solid var(--ln);background:#0d0f11;color:var(--tx);width:100%}
.seg-pick{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.seg-pick button{background:none;border:0;min-height:44px;font:700 13px var(--mono);color:var(--mu)}
.seg-pick button.on{background:var(--ac);color:#0a0b0d}
.map{width:100%;height:220px;background:#0f1114}
.mini{width:68px;height:68px;border-radius:10px;overflow:hidden;flex:none;background:#15181c}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
.sheet{background:var(--pn);border:1px solid var(--ln);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90%;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.leaflet-container{background:#0f1114;font-family:var(--body)}
.leaflet-control-attribution{font-size:9px;background:rgba(10,11,13,.7)!important;color:#7d858f!important}
.leaflet-control-attribution a{color:#9aa1a9!important}
svg text{font-family:var(--mono)}
/* Animaciones de entrada (solo al cambiar de pestaña) */
.anim .pn,.anim .alert{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.anim .pn:nth-child(2){animation-delay:.04s}.anim .pn:nth-child(3){animation-delay:.08s}.anim .pn:nth-child(4){animation-delay:.12s}.anim .pn:nth-child(5){animation-delay:.16s}.anim .pn:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.anim .arc{animation:arc 1.1s cubic-bezier(.2,.8,.2,1) both .1s}
@keyframes arc{from{stroke-dashoffset:var(--len)}}
.anim .rseg{animation:seg .25s both}
@keyframes seg{from{opacity:.05}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.live i{animation:none}}
/* Modo conducción */
#drive{position:fixed;inset:0;z-index:3000;background:#000;color:#f4f5f6;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));gap:18px;border:0;text-align:left;width:100%}
#drive.night{--ac:#ff8a3d;--ok:#3fbf8a;color:#b9b2a8}
#drive.night .big-speed{color:#d8d0c4}
.big-speed{font-family:var(--mono);font-weight:700;font-size:min(46vw,190px);line-height:.85;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gear-box{width:112px;height:122px;background:var(--ac);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000}
</style>
</head>
<body>
<header>
  <div class="col" style="gap:2px"><span class="k" id="hSub">Fiesta ST · Mk8</span><span class="title" id="hTitle">MI ST</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="badge"></span>
    <button class="chip" id="cfgBtn" aria-label="Ajustes" style="padding:9px;background:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="estado"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3z"/></svg>Estado</button>
  <button data-tab="viajes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>Viajes</button>
  <button data-tab="motor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/></svg>Motor</button>
  <button data-tab="datos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Datos</button>
  <button data-tab="taller"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Taller</button>
</nav>
<div id="sheetHost"></div>
<div id="driveHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const nf = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const C = { ac: '#ffd400', ok: '#2ee59d', wa: '#ffb21e', bad: '#ff4d3d', blue: '#4aa3ff', mu: '#7d858f', tx: '#f4f5f6' };
const TABS = ['estado', 'viajes', 'motor', 'datos', 'taller'];
const TITLES = { estado: ['Fiesta ST · Mk8', 'MI ST'], viajes: ['Últimos trayectos', 'VIAJES'], motor: ['Telemetría', 'MOTOR'], datos: ['Consumo, gasto y batería', 'DATOS'], taller: ['Mantenimiento', 'TALLER'], ajustes: ['Conexión y avisos', 'AJUSTES'] };
// CARTO ahora pide clave: mapa de OpenStreetMap (gratis, sin clave) oscurecido con un filtro.
const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

let cfg = {};
try { cfg = JSON.parse(localStorage.getItem('fst_cfg') || '{}'); } catch (e) {}
cfg.fuel = cfg.fuel === '95' ? '95' : '98';
const hashTab = location.hash.slice(1);
let tab = !(cfg.url && cfg.key) ? 'ajustes' : TABS.includes(hashTab) ? hashTab : 'estado';
let live = null, hist = null, battery = null, refuels = null, trips = null, records = null, tripDetail = null, maint = null, fuel = null, fuelErr = null;
let error = null, notice = null, timer = null, sheet = null, loaded = {}, animate = true;
let tyrePrefs = null, tyreSet = null, deadlines = null, trackdays = null, driveDismissed = false, driveForced = false, parking = null, guard = null, circuits = null, customCircuits = [];

// ---------- Vibración (Android: vibrate; iPhone: truco del interruptor nativo) ----------
const hapEl = (() => {
  const l = document.createElement('label');
  l.setAttribute('aria-hidden', 'true');
  l.style.cssText = 'position:fixed;left:-100px;top:0;width:1px;height:1px;overflow:hidden;opacity:0';
  const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l); return l;
})();
function haptic() { try { if (navigator.vibrate) navigator.vibrate(8); else hapEl.click(); } catch (e) {} }
document.addEventListener('click', e => { if (e.target.closest('button, a.btn, a.li')) haptic(); }, true);

// ---------- API ----------
async function api(path, opts = {}) {
  const headers = { 'x-app-key': cfg.key };
  if (opts.body) headers['content-type'] = 'application/json';
  let r;
  try { r = await fetch(cfg.url.replace(/\/+$/, '') + path, { ...opts, headers }); }
  catch (e) { throw new Error('No se puede conectar con el servidor. Revisa la URL en Ajustes o tu conexión.'); }
  const j = await r.json().catch(() => ({ error: 'El servidor no ha devuelto datos válidos' }));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}

async function loadLive() {
  const wasRunning = live && live.ignition !== 'off';
  try { live = await api('/api/live'); error = null; } catch (e) { error = e.message; }
  const running = live && live.ignition !== 'off';
  if (!running) driveDismissed = false;
  if (running && !wasRunning && !driveDismissed) haptic();
  renderDrive();
  if (!sheet && ['estado', 'motor'].includes(tab)) render(); else renderBadge();
  schedule();
}

const stale = (key, ms) => !loaded[key] || Date.now() - loaded[key] > ms;
async function loadFor(t, force) {
  const jobs = [];
  const add = (key, ms, fn) => { if (force || stale(key, ms)) jobs.push(fn().then(() => { loaded[key] = Date.now(); })); };
  if (t === 'estado') add('parking', 30e3, async () => { parking = await api('/api/parking'); });
  if (t === 'ajustes') add('guard', 30e3, async () => { guard = await api('/api/guard'); });
  if (t === 'ajustes') add('tyres', 300e3, async () => { tyrePrefs = await api('/api/tyres'); });
  if (t === 'estado' || t === 'datos') add('battery', 300e3, async () => { battery = await api('/api/battery'); });
  if (t === 'taller') { add('tyreset', 60e3, async () => { tyreSet = await api('/api/tyreset'); }); add('deadlines', 60e3, async () => { deadlines = (await api('/api/deadlines')).items; }); }
  if (t === 'viajes') add('trackdays', 120e3, async () => { trackdays = (await api('/api/trackdays')).days; });
  if (t === 'estado' || t === 'taller') add('maint', t === 'taller' ? 30e3 : 300e3, async () => { maint = await api('/api/maintenance'); });
  if (t === 'estado' || t === 'datos') add('fuel', 600e3, async () => {
    try { fuel = await api('/api/fuel?type=' + cfg.fuel); fuelErr = null; } catch (e) { fuelErr = e.message; }
  });
  if (t === 'viajes') {
    add('trips', 60e3, async () => { trips = (await api('/api/trips?limit=60')).trips; });
    add('records', 300e3, async () => { records = await api('/api/trips/records'); });
    add('circuits', 300e3, async () => { const r = await api('/api/circuits'); circuits = r.circuits; customCircuits = r.custom || []; });
  }
  if (t === 'datos') add('datos', 120e3, async () => { [hist, refuels] = await Promise.all([api('/api/history?days=7'), api('/api/refuels')]); });
  if (!jobs.length) return;
  try { await Promise.all(jobs); error = null; } catch (e) { error = e.message; }
  if (tab === t && !sheet) render();
}

function schedule() {
  clearTimeout(timer);
  if (document.hidden || !cfg.url || tab === 'ajustes') return;
  const running = live && live.ignition !== 'off';
  timer = setTimeout(loadLive, running ? 5000 : 60000);
}

// ---------- Formatos ----------
function ago(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'hace ' + Math.max(s, 0) + ' s';
  if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
  return 'hace ' + Math.round(s / 86400) + ' d';
}
const hm = ts => new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
function dayLabel(ts) {
  const d = new Date(ts), t = new Date(), k = x => x.toDateString();
  if (k(d) === k(t)) return 'Hoy';
  const y = new Date(t); y.setDate(t.getDate() - 1);
  if (k(d) === k(y)) return 'Ayer';
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric' });
}
const clock = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}h${String(m).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`; };
const tyreLow = (c, k) => Array.isArray(c.tyres_low) ? c.tyres_low.includes(k) : c.tyres && c.tyres[k] != null && c.tyres[k] < 2.2;
const speedCol = v => v < 70 ? C.ac : v < 95 ? C.wa : C.bad;
const pad2 = n => String(n).padStart(2, '0');

function sunUp(lat, lon, d = new Date()) {
  const r = Math.PI / 180;
  const day = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
  const decl = -23.44 * Math.cos(r * 360 / 365 * (day + 10));
  const ha = (d.getUTCHours() + d.getUTCMinutes() / 60 - 12) * 15 + lon;
  const el = Math.asin(Math.sin(lat * r) * Math.sin(decl * r) + Math.cos(lat * r) * Math.cos(decl * r) * Math.cos(ha * r)) / r;
  return el > -4;
}

// ---------- Piezas gráficas ----------
function arcPath(cx, cy, rad, a0, a1) {
  const p = a => [cx + rad * Math.cos(a * Math.PI / 180), cy + rad * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${rad} ${rad} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function fuelArc(pct) {
  const f = Math.max(0, Math.min(1, (pct || 0) / 100));
  const len = 54 * Math.PI * 1.5;
  const col = pct < 15 ? C.bad : C.ac;
  return `<svg width="112" height="112" viewBox="0 0 132 132" role="img" aria-label="Depósito al ${nf(pct)} %">
    <path d="${arcPath(66, 66, 54, 135, 405)}" fill="none" stroke="#1d2126" stroke-width="10" stroke-linecap="round"/>
    <path class="arc" style="--len:${len.toFixed(1)}" d="${arcPath(66, 66, 54, 135, 405)}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)}" stroke-dashoffset="${(len * (1 - f)).toFixed(1)}"/>
    <text x="66" y="72" text-anchor="middle" fill="#f4f5f6" font-weight="700" font-size="30">${nf(pct)}%</text>
    <text x="66" y="92" text-anchor="middle" fill="#7d858f" font-weight="600" font-size="10" letter-spacing="2">DEPÓSITO</text></svg>`;
}
function revBar(rpm, n = 28, max = 7000, h = 22) {
  const w = 350, sw = w / n;
  let out = '';
  for (let i = 0; i < n; i++) {
    const r = (i + 1) / n * max;
    const col = r <= 4000 ? C.ok : r <= 5800 ? C.ac : C.bad;
    const on = r <= (rpm || 0) + 1;
    out += `<rect class="rseg" style="animation-delay:${i * 18}ms" x="${(i * sw + 1).toFixed(1)}" y="0" width="${(sw - 3).toFixed(1)}" height="${h}" rx="2" fill="${col}" opacity="${on ? 1 : .13}"/>`;
  }
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${nf(rpm)} rpm">${out}</svg>`;
}
function spark(vals, w = 92, h = 18, col = C.ac, sw = 1.5) {
  if (!vals || vals.length < 2) return '';
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + (i * w / (vals.length - 1)).toFixed(1) + ' ' + (h - 2 - (v - mn) / ((mx - mn) || 1) * (h - 4)).toFixed(1)).join(' ');

function lineChart(points, key, { min, max, fmt, color, xKey = 'ts', label = 'Gráfica', dayTicks = true, h = 130 }) {
  if (!points || points.length < 2) return '<p class="muted">Aún no hay datos suficientes.</p>';

function batteryBars(days) {

const maps = {};
function mapIn(id, host, opts = {}) {
  if (!window.L || !host) return null;
  let m = maps[id];
  if (opts.fresh) {
    // Mapa nuevo dentro del propio hueco (ya está en la página y tiene tamaño)
    if (m) { try { m.map.remove(); } catch (e) {} }
    host.style.height = host.style.height || '220px';
    const map = L.map(host, { zoomControl: false, attributionControl: true, scrollWheelZoom: false, boxZoom: false, keyboard: false });
    L.tileLayer(TILE, { attribution: '© OpenStreetMap', maxZoom: 19, }).addTo(map);
    m = maps[id] = { el: host, map, layer: L.layerGroup().addTo(map), fit: null };
    const refit = () => { map.invalidateSize(); if (m.fit) m.fit(); };
    requestAnimationFrame(refit); setTimeout(refit, 300); setTimeout(refit, 900);
    return m;
  }
  if (!m) {
    const el = document.createElement('div');
    el.className = host.className;
    const map = L.map(el, { zoomControl: false, attributionControl: !opts.mini, dragging: !opts.mini, scrollWheelZoom: false, doubleClickZoom: !opts.mini, touchZoom: !opts.mini, boxZoom: false, keyboard: false });
    L.tileLayer(TILE, { attribution: '© OpenStreetMap', maxZoom: 19, }).addTo(map);
    m = maps[id] = { el, map, layer: L.layerGroup().addTo(map) };
  }
  host.replaceWith(m.el);
  m.map.invalidateSize();
  m.fit = null;
  // El mapa se crea fuera de la página y al principio mide 0: se vuelve a encuadrar cuando ya tiene tamaño.
  const refit = () => { m.map.invalidateSize(); if (m.fit) m.fit(); };
  requestAnimationFrame(refit); setTimeout(refit, 250); setTimeout(refit, 800);
  return m;
}

function viewViajes() {
  if (tripDetail) return viewTrip(tripDetail);
  if (!trips) return '<div class="pn pad"><p class="muted">Cargando trayectos…</p></div>';
  if (!trips.length) return '<div class="pn pad"><p class="muted">Todavía no hay trayectos. Aparecerán cuando muevas el coche.</p></div>';
  const wk = trips.filter(t => t.start_ts >= Date.now() - 7 * 86400e3);
  const km = wk.reduce((s, t) => s + t.km, 0), secs = wk.reduce((s, t) => s + t.duration_s, 0), top = Math.max(0, ...wk.map(t => t.max_speed));
  const rec = (label, t, val, unit) => t ? `<button class="pn col" data-trip="${t.id}" style="padding:12px 14px;gap:4px;text-align:left"><span class="k">${label}</span><span class="m" style="font-size:24px;font-weight:700;color:${C.ac}">${val} <span style="font-size:12px;color:#7d858f;font-weight:500">${unit}</span></span><span style="font-size:11px;color:#7d858f">${esc(dayLabel(t.start_ts))} · #${pad2(t.id)}</span></button>` : '';
  let html = `<div class="pn pad g3" style="gap:8px">
    <div class="col" style="gap:4px"><span class="k">7 días</span><span class="m" style="font-size:24px;font-weight:700">${nf(km)} <span style="font-size:12px;color:#7d858f">km</span></span></div>
    <div class="col" style="gap:4px"><span class="k">Al volante</span><span class="m" style="font-size:24px;font-weight:700">${clock(secs)}</span></div>
    <div class="col" style="gap:4px"><span class="k">Coste</span><span class="m" style="font-size:24px;font-weight:700">${nf(wk.reduce((s, t) => s + (t.cost_eur || 0), 0), 0)} <span style="font-size:12px;color:#7d858f">€</span></span></div>
  </div>`;
  if (records && records.top_speed) html += `<div class="k" style="padding:6px 2px 0">Récords</div><div class="g2">
    ${rec('Velocidad punta', records.top_speed, nf(records.top_speed?.max_speed), 'km/h')}
    ${rec('Más eficiente', records.best_eff, nf(records.best_eff?.l100, 1), 'l/100')}
    ${rec('Más largo', records.longest, nf(records.longest?.km, 1), 'km')}
    ${rec('Régimen máximo', records.top_rpm, nf(records.top_rpm?.max_rpm), 'rpm')}</div>`;
  if (circuits && circuits.length) html += `<div class="k" style="padding:6px 2px 0">Circuitos</div>` + circuits.map(ci => `
    <div class="pn pad col" style="gap:10px">
      <div class="row"><span style="font-size:16px;font-weight:600">🏁 ${esc(ci.circuit)}</span><span style="font-size:12px;color:#7d858f">${ci.days} día${ci.days > 1 ? 's' : ''} · último ${esc(dayLabel(ci.last_ts))}</span></div>
      <div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">Punta</span><span class="m" style="font-size:20px;font-weight:700;color:${C.ac}">${nf(ci.top_speed)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Rpm máx.</span><span class="m" style="font-size:20px;font-weight:700">${nf(ci.top_rpm)}</span></div>
        <div class="col" style="gap:2px"><span class="k">En pista</span><span class="m" style="font-size:20px;font-weight:700">${nf(ci.km)} km</span></div>
      </div></div>`).join('');
  if (trackdays && trackdays.length) html += `<div class="k" style="padding:6px 2px 0">Días de circuito</div>` + trackdays.map((d, i) => `
    <div class="pn pad col" style="gap:10px">
      <div class="row"><span style="font-size:15px;font-weight:600">${esc(d.circuit)}</span><span style="font-size:12px;color:#7d858f">${new Date(d.day).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}</span></div>
      <div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">En pista</span><span class="m" style="font-size:18px;font-weight:700">${nf(d.km, 1)} km</span></div>
        <div class="col" style="gap:2px"><span class="k">Punta</span><span class="m" style="font-size:18px;font-weight:700;color:${C.ac}">${nf(d.top_speed)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Motor máx.</span><span class="m" style="font-size:18px;font-weight:700">${d.top_temp ? nf(d.top_temp) + '°' : '—'}</span></div>
        <div class="col" style="gap:2px"><span class="k">Tandas</span><span class="m" style="font-size:18px;font-weight:700">${d.sessions}</span></div>
        <div class="col" style="gap:2px"><span class="k">Gasolina</span><span class="m" style="font-size:18px;font-weight:700">${d.fuel_l != null ? nf(d.fuel_l, 1) + ' L' : '—'}</span></div>
        <div class="col" style="gap:2px"><span class="k">Coste</span><span class="m" style="font-size:18px;font-weight:700">${d.cost_eur != null ? nf(d.cost_eur, 2) + ' €' : '—'}</span></div>
      </div>
      ${d.note ? `<p style="margin:0;font-size:14px;white-space:pre-wrap;color:#c9ced4">${esc(d.note)}</p>` : ''}
      <button class="btn sec" data-tracknote="${i}">${d.note ? 'Editar notas' : 'Añadir notas (presiones, reglajes…)'}</button>
    </div>`).join('');
  let day = null, group = '';
  const flush = () => { if (day) html += `<div class="pn" style="padding:4px 16px"><div class="k" style="padding:12px 0 4px">${esc(day)}</div>${group}</div>`; };
  for (const t of trips) {
    const d = dayLabel(t.start_ts);
    if (d !== day) { flush(); day = d; group = ''; }
    group += `<button class="li" data-trip="${t.id}" style="grid-template-columns:34px 1fr 92px">
      <span class="m" style="font-size:13px;color:#7d858f;font-weight:600">#${pad2(t.id)}</span>
      <span class="col" style="gap:2px"><span class="m" style="font-size:16px;font-weight:600">${hm(t.start_ts)} → ${hm(t.end_ts)}${t.track ? ` <span class="tag" style="color:${C.ac};border-color:#4a4210;font-size:10px">${t.circuit ? '🏁 ' + esc(t.circuit.replace('Circuito de ', '')) : 'Circuito'}</span>` : ''}</span><span style="font-size:12px;color:#7d858f">Media ${nf(t.avg_speed)}${t.max_speed != null ? ' · máx. ' + nf(t.max_speed) : ''}${t.cost_eur != null ? ' · ' + nf(t.cost_eur, 2) + ' €' : ''}</span></span>
      <span class="col" style="gap:4px;align-items:flex-end"><span class="m" style="font-size:18px;font-weight:700">${nf(t.km, 1)} km</span>${spark(t.spark)}</span>
    </button>`;
  }
  flush();
  return html;
}

function viewTrip(t) {
  const l100 = t.km > 1 && t.fuel_used_l ? t.fuel_used_l / t.km * 100 : null;
  const pts = (t.points || []).map(p => ({ ts: p[3], s: p[2] }));
  const trow = (label, val, unit = '', hi) => `<div class="row" style="padding:10px 0;border-top:1px solid #1b1e22;align-items:baseline"><span class="k">${label}</span><span class="m" style="font-size:20px;font-weight:700;${hi ? 'color:' + C.ac : ''}">${val} <span style="font-size:12px;color:#7d858f;font-weight:500">${unit}</span></span></div>`;
  let cmp = '';
  if (t.route) {
    const diff = t.duration_s - t.route.avg_duration_s, same = Math.abs(diff) < 30, faster = diff < 0;
    cmp = `<div class="pn pad col" style="gap:8px">
      <span class="k">Este recorrido · ${t.route.count + 1} veces</span>
      <div class="row" style="align-items:baseline"><span style="font-size:15px">${same ? 'En tu media de siempre' : faster ? 'Más rápido que tu media' : 'Más lento que tu media'}</span>
        <span class="m" style="font-size:24px;font-weight:700;color:${same ? C.tx : faster ? C.ok : C.wa}">${same ? '=' : (faster ? '−' : '+') + clock(Math.abs(diff))}</span></div>
      <div class="g3" style="gap:8px">
        <div class="col" style="gap:2px"><span class="k">Media</span><span class="m" style="font-size:16px;font-weight:600">${clock(t.route.avg_duration_s)}</span></div>
        <div class="col" style="gap:2px"><span class="k">Mejor</span><span class="m" style="font-size:16px;font-weight:600">${clock(Math.min(t.route.best_duration_s, t.duration_s))}</span></div>
        <div class="col" style="gap:2px"><span class="k">Coste medio</span><span class="m" style="font-size:16px;font-weight:600">${t.route.avg_cost_eur != null ? nf(t.route.avg_cost_eur, 2) + ' €' : '—'}</span></div>
      </div></div>`;
  }
  return `
  ${t.circuit ? `<div class="pn pad row"><span class="k" style="color:${C.ac}">🏁 ${esc(t.circuit)}</span><span style="font-size:12px;color:#7d858f">Sesión en circuito</span></div>` : ''}
  <div class="pn" style="overflow:hidden;position:relative"><div id="tripMapHost" class="map"></div>
    <div class="m" style="position:absolute;left:10px;bottom:22px;z-index:500;display:flex;gap:10px;background:rgba(10,11,13,.85);border-radius:8px;padding:6px 10px;font-size:11px">
      ${t.max_speed == null ? `<span style="color:${C.ok}">● Salida</span><span style="color:#f4f5f6">● Llegada</span>` : `<span style="color:${C.ac}">● &lt;70</span><span style="color:${C.wa}">● 70–95</span><span style="color:${C.bad}">● &gt;95 km/h</span>`}</div></div>
  <div class="g2">${kv('Distancia', nf(t.km, 1), 'km')}${kv('Tiempo', clock(t.duration_s))}</div>
  ${cmp}
  <div class="pn" style="padding:4px 16px">
    ${trow('Velocidad media', nf(t.avg_speed), 'km/h')}${trow('Velocidad punta', nf(t.max_speed), 'km/h', true)}
    ${trow('Régimen máximo', nf(t.max_rpm), 'rpm')}${trow('Motor al acabar (máx.)', nf(t.max_oil), '°C')}
    ${trow('Acelerador medio', nf(t.avg_throttle), '%')}${trow('Sobre 4.000 rpm', nf(t.rpm_high_pct), '%')}
    ${trow('Consumo estimado', l100 ? nf(l100, 1) : '—', 'l/100')}
    ${trow('Coste del trayecto', t.cost_eur != null ? nf(t.cost_eur, 2) : '—', '€', true)}
  </div>
  ${t.price_l ? `<p class="muted" style="padding:0 4px">Coste calculado con ${nf(t.price_l, 3)} €/L (tu último repostaje con precio, o la media de gasolineras cercanas).</p>` : ''}
  ${t.max_speed == null ? `<p class="muted" style="padding:0 4px">El coche no mandó datos durante este trayecto, solo al arrancar y al apagar: el mapa une la salida y la llegada en línea recta y no hay velocidad ni rpm.</p>` : `<div class="pn pad col" style="gap:8px"><span class="k">Velocidad</span>${lineChart(pts, 's', { min: 0, max: Math.max(60, Math.ceil(t.max_speed / 20) * 20), fmt: v => nf(v), color: C.ac, dayTicks: false, label: 'Velocidad durante el trayecto' })}</div>`}`;
}

function viewDatos() {
  if (!hist || !refuels) return '<div class="pn pad"><p class="muted">Cargando datos…</p></div>';
  const pts = hist.points;
  const km7 = pts.length > 1 ? pts[pts.length - 1].odometer - pts[0].odometer : 0;
  const priced = refuels.refuels.filter(r => r.price_total);
  const now = new Date();
  const month = priced.filter(r => { const d = new Date(r.ts); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const spend = month.reduce((s, r) => s + r.price_total, 0);
  const pL = priced.length ? priced.reduce((s, r) => s + r.price_total, 0) / priced.reduce((s, r) => s + r.litres, 0) : (fuel && fuel.avg);
  const eurKm = pL && refuels.avg_l100 ? pL * refuels.avg_l100 / 100 : null;
  const monthName = now.toLocaleDateString('es-ES', { month: 'long' });
  const rows = refuels.refuels.slice(0, 10).map(r => `
    <button class="li" data-refuel="${r.ts}" style="grid-template-columns:1fr auto">
      <span class="col" style="gap:2px"><span style="font-size:15px;font-weight:600">${new Date(r.ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}${r.station ? ' · ' + esc(r.station) : ''}</span>
      <span style="font-size:12px;color:#7d858f">${nf(r.odometer)} km${r.l100 ? ' · ' + nf(r.l100, 1) + ' l/100' : ''}</span></span>
      <span class="col" style="gap:2px;align-items:flex-end"><span class="m" style="font-size:18px;font-weight:700">${r.litres != null ? nf(r.litres, 1) + ' L' : 'Lleno'}</span>
      <span style="font-size:12px;color:${r.price_total || r.price_l ? C.mu : C.ac}">${r.price_total ? nf(r.price_total, 2) + ' €' + (r.price_auto ? ' · estimado' : ' · ' + nf(r.price_l, 3) + ' €/L') : r.price_l ? nf(r.price_l, 3) + ' €/L' : 'Añadir precio'}</span></span>
    </button>`).join('') || '<p class="muted" style="padding:0 0 12px">Todavía no se ha detectado ningún repostaje.</p>';
  const st = fuel && fuel.stations ? fuel.stations.slice(0, 6) : [];
  const other = cfg.fuel === '95' ? '98' : '95';
  const stations = st.map((s, i) => `
    <a class="li" href="https://maps.apple.com/?daddr=${s.lat},${s.lon}" style="grid-template-columns:1fr auto;color:inherit;text-decoration:none">
      <span class="col" style="gap:2px;min-width:0"><span style="font-size:15px;font-weight:600">${esc(s.name)}</span><span style="font-size:12px;color:#7d858f">${esc(s.town)} · ${nf(s.km, 1)} km</span></span>
      <span class="col" style="gap:1px;align-items:flex-end"><span class="m" style="font-size:20px;font-weight:700;color:${i === 0 ? C.ac : C.tx}"><span style="font-size:11px;color:#7d858f;font-weight:500">${cfg.fuel} </span>${nf(s.price, 3)}</span><span class="m" style="font-size:13px;color:#9aa2ab">${other} ${s['p' + other] ? nf(s['p' + other], 3) : '—'}</span></span>
    </a>`).join('');
  return `
  <div class="g2">
    ${kv('Consumo medio', nf(refuels.avg_l100, 1), 'l/100')}
    ${kv('Gasto ' + monthName, month.length ? nf(spend, 2) : '—', '€')}
    ${kv('Coste por km', eurKm ? nf(eurKm * 100, 1) : '—', 'cént.')}
    ${kv('7 días', nf(km7), 'km')}
  </div>
  <div class="pn pad col" style="gap:10px"><div class="row"><span class="k">Depósito · 7 días</span><span class="m" style="font-size:13px;color:${C.ac}">${pts.length ? nf(pts[pts.length - 1].fuel_pct) + ' %' : ''}</span></div>
    ${lineChart(pts, 'fuel_pct', { min: 0, max: 100, fmt: v => nf(v), color: C.ac, label: 'Nivel del depósito' })}</div>
  <div class="pn pad col" style="gap:10px"><div class="row"><span class="k">Batería · mínimo diario</span>${trendTag(battery)}</div>
    ${batteryBars(battery && battery.days)}
    <p class="muted">Por debajo de 12,2 V (línea roja) la batería sufre. Si baja día a día con el coche parado, revísala antes de que no arranque.</p></div>
  <div class="pn" style="padding:4px 16px">
    <div class="row" style="padding:12px 0"><span class="k">Gasolina ${cfg.fuel} cerca del coche</span>${fuel && fuel.date ? `<span style="font-size:11px;color:#7d858f">Ministerio · ${esc(String(fuel.date).slice(0, 16))}</span>` : ''}</div>
    ${stations || `<p class="muted" style="padding:0 0 12px">${esc(fuelErr || 'Cargando precios…')}</p>`}
  </div>
  <div class="pn" style="padding:4px 16px">
    <div class="row" style="padding:12px 0"><span class="k">Repostajes</span><button class="m" id="copyCsv" style="background:none;border:0;color:${C.ac};font-size:12px;font-weight:600;letter-spacing:.08em;min-height:36px">COPIAR CSV</button></div>
    ${rows}
  </div>`;
}

function viewTaller() {
  if (!maint) return '<div class="pn pad"><p class="muted">Cargando mantenimiento…</p></div>';
  const col = { vencido: C.bad, pronto: C.wa, ok: C.ok, 'sin datos': C.mu };
  const lab = { vencido: 'Vencido', pronto: 'Pronto', ok: 'Al día', 'sin datos': 'Sin configurar' };
  const items = maint.items.map(i => {
    const segs = Array.from({ length: 12 }, (_, k) => `<div style="height:10px;border-radius:2px;background:${i.status !== 'sin datos' && (k + 1) / 12 <= i.pct + 1e-9 ? col[i.status] : '#1d2126'}"></div>`).join('');
    const last = [i.last_km != null ? 'Último: ' + nf(i.last_km) + ' km' : '', i.last_date ? new Date(i.last_date).toLocaleDateString('es-ES') : '',
      i.interval_km ? 'cada ' + nf(i.interval_km) + ' km' : '', i.interval_months ? 'cada ' + i.interval_months + ' meses' : ''].filter(Boolean).join(' · ');
    return `<div class="pn pad col" style="gap:10px">
      <div class="row"><span style="font-size:16px;font-weight:600">${esc(i.name)}</span><span class="tag" style="color:${col[i.status]};border-color:${col[i.status]}55">${lab[i.status]}</span></div>
      <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px">${segs}</div>
      <div class="col" style="gap:2px"><span class="m" style="font-size:14px;font-weight:600">${esc(i.summary)}</span><span style="font-size:12px;color:#7d858f">${esc(last)}</span>${i.track_note ? `<span style="font-size:12px;color:${C.ac}">🏁 ${esc(i.track_note)}</span>` : ''}${i.notes ? `<span style="font-size:12px;color:#7d858f">${esc(i.notes)}</span>` : ''}</div>
      <div class="btns"><button class="btn sec" data-done="${i.id}">Hecho hoy</button><button class="btn sec" data-edit="${i.id}">Editar</button></div>
    </div>`;
  }).join('');
  return `
  ${live && live.oil_life_pct != null ? `<div class="pn pad col" style="gap:8px"><div class="row"><span class="k">Vida del aceite · según Ford</span><span class="m" style="font-size:26px;font-weight:700;color:${live.oil_life_pct < 15 ? C.bad : live.oil_life_pct < 30 ? C.wa : C.ok}">${nf(live.oil_life_pct)} %</span></div>
    <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px">${Array.from({ length: 12 }, (_, k) => `<div style="height:10px;border-radius:2px;background:${(k + 1) / 12 <= live.oil_life_pct / 100 + 1e-9 ? (live.oil_life_pct < 15 ? C.bad : live.oil_life_pct < 30 ? C.wa : C.ok) : '#1d2126'}"></div>`).join('')}</div>
    <span style="font-size:12px;color:#7d858f">El coche lo calcula según tu forma de conducir. Cuando llegue a 0 % toca cambiarlo.</span></div>` : ''}
  <div class="pn pad row"><div class="col" style="gap:4px"><span class="k">Odómetro</span><span class="m" style="font-size:26px;font-weight:700">${nf(maint.odometer)} km</span></div>
    <span style="font-size:12px;color:#7d858f;max-width:170px;text-align:right">Intervalos de ejemplo: ajústalos. Aviso a las 9:00 si faltan 1.000 km o 30 días.</span></div>
  ${tyreCard()}
  ${deadlineCard()}
  ${items}
  <button class="btn ghost" data-edit="new" style="min-height:52px">+ Añadir tarea</button>`;
}

function tyreCard() {
  const t = tyreSet;
  if (!t) return '';
  if (!t.model && t.mounted_km == null) return `<button class="pn pad col" data-tyreset style="gap:6px;text-align:left"><span class="k">Neumáticos</span><span style="font-size:15px">Añade qué ruedas llevas y cuándo las montaste para contar sus km.</span></button>`;
  const rot = t.rotate_in_km;
  return `<div class="pn pad col" style="gap:10px">
    <div class="row"><span class="k">Neumáticos</span>${rot != null ? `<span class="tag" style="color:${rot <= 0 ? C.wa : C.ok};border-color:${rot <= 0 ? C.wa : C.ok}55">${rot <= 0 ? 'Toca rotar' : 'Rotar en ' + nf(rot) + ' km'}</span>` : ''}</div>
    <div class="col" style="gap:2px"><span style="font-size:16px;font-weight:600">${esc(t.model || 'Sin modelo')}</span><span class="muted">${esc(t.size || '')}${t.mounted_date ? ' · montadas el ' + new Date(t.mounted_date).toLocaleDateString('es-ES') : ''}</span></div>
    <div class="g3" style="gap:8px">
      <div class="col" style="gap:2px"><span class="k">Total</span><span class="m" style="font-size:20px;font-weight:700">${t.km != null ? nf(t.km) : '—'}<span style="font-size:12px;color:#7d858f"> km</span></span></div>
      <div class="col" style="gap:2px"><span class="k">En circuito</span><span class="m" style="font-size:20px;font-weight:700;color:${C.ac}">${nf(t.track_km)}<span style="font-size:12px;color:#7d858f"> km</span></span></div>
      <div class="col" style="gap:2px"><span class="k">Días pista</span><span class="m" style="font-size:20px;font-weight:700">${nf(t.track_days)}</span></div>
    </div>
    <div class="btns"><button class="btn sec" data-tyrerot>Rotadas hoy</button><button class="btn sec" data-tyreset>Editar</button></div>
  </div>`;
}

function deadlineCard() {
  if (!deadlines) return '';
  const col = { vencido: C.bad, pronto: C.wa, ok: C.ok, 'sin datos': C.mu };
  return `<div class="pn" style="padding:4px 16px">
    <div class="k" style="padding:12px 0 4px">Fechas · aviso a 30, 7 y 1 día</div>
    ${deadlines.map(d => `<button class="li" data-deadline="${esc(d.id)}" style="grid-template-columns:1fr auto">
      <span class="col" style="gap:2px"><span style="font-size:15px;font-weight:600">${esc(d.name)}</span><span style="font-size:12px;color:#7d858f">${d.date ? new Date(d.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Toca para poner la fecha'}</span></span>
      <span class="m" style="font-size:14px;font-weight:700;color:${col[d.status]}">${d.days == null ? '—' : d.days < 0 ? 'Vencido' : d.days === 0 ? 'Hoy' : d.days + ' días'}</span>
    </button>`).join('')}

}

// ---------- Modo conducción ----------
function renderDrive() {
  const host = $('#driveHost');
  const c = live;
  const running = c && c.ignition !== 'off';
  const show = c && (driveForced || (running && !driveDismissed));
  if (!show) { host.innerHTML = ''; return; }
  const night = c.location ? !sunUp(c.location.lat, c.location.lon) : (new Date().getHours() >= 19 || new Date().getHours() < 8);
  const wt = c.oil_c ?? c.coolant_c, hot = c.oil_c != null ? 80 : 85;
  const oilCol = wt >= hot ? 'var(--ok)' : wt >= 60 ? 'var(--wa)' : 'var(--blue)';
  host.innerHTML = `<button id="drive" class="${night ? 'night' : ''}" aria-label="Salir del modo conducción">
    <span class="row" style="width:100%"><span class="k" style="color:var(--ac);display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--ac)"></span>Modo conducción${night ? ' · noche' : ''}</span>
      <span class="m" style="font-size:13px;color:#7d858f">${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}${c.outside_c != null ? ' · ' + nf(c.outside_c) + ' °C' : ''}</span></span>
    <span style="width:100%;display:block;${night ? 'filter:saturate(.7) brightness(.8)' : ''}">${revBar(running ? c.rpm : 0, 32, 7000, 30)}</span>
    <span class="col" style="flex:1;align-items:center;justify-content:center;width:100%">
      <span class="big-speed">${running ? nf(c.speed_kmh) : '0'}</span><span class="k" style="font-size:14px">km/h</span></span>
    <span style="display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;width:100%">
      <span class="col" style="gap:4px"><span class="k">${c.oil_c != null ? 'Aceite' : 'Motor'}</span><span class="m" style="font-size:40px;font-weight:700;color:${oilCol};line-height:1">${nf(wt)}°</span></span>
      <span class="gear-box"><span class="m" style="font-size:92px;font-weight:700;line-height:.85">${running && c.gear ? c.gear : 'N'}</span><span class="m" style="font-size:11px;font-weight:700;letter-spacing:.14em">MARCHA</span></span>
      <span class="col" style="gap:4px;align-items:flex-end"><span class="k">Régimen</span><span class="m" style="font-size:40px;font-weight:700;line-height:1">${running ? nf(c.rpm) : '—'}</span></span>
    </span>
    <span style="text-align:center;font-size:12px;color:#4b525a;width:100%">Toca para salir · se abre solo al arrancar</span>
  </button>`;
  $('#drive').onclick = () => { driveDismissed = true; driveForced = false; renderDrive(); };
}

// ---------- Render ----------
function renderBadge() {
  const running = live && live.ignition !== 'off';
  const state = !live ? '' : running ? `<span class="chip live" style="color:${C.ac}"><i></i>En marcha</span>`
    : live.locked === false ? `<span class="chip" style="color:${C.bad}"><i></i>Abierto</span>` : `<span class="chip" style="color:${C.ok}"><i></i>Cerrado</span>`;
  const src = live && live.source === 'mock' ? `<span class="chip" style="color:${C.wa}">Prueba</span>` : '';
  $('#badge').innerHTML = tab === 'ajustes' ? '' : tab === 'estado' ? state : src;
  const [sub, title] = tripDetail && tab === 'viajes' ? [`${dayLabel(tripDetail.start_ts)} · ${hm(tripDetail.start_ts)} → ${hm(tripDetail.end_ts)}`, `TRAYECTO #${pad2(tripDetail.id)}`] : TITLES[tab];
  $('#hSub').textContent = sub; $('#hTitle').textContent = title;
}

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#nav').style.display = tab === 'ajustes' ? 'none' : 'grid';
  renderBadge();
  let html = '';
  if (tripDetail && tab === 'viajes') html += `<button class="btn sec" id="backTrips" style="align-self:flex-start;min-height:40px">← Trayectos</button>`;
  if (notice) html += `<div class="okmsg">${esc(notice)}</div>`;
  if (error) html += `<div class="err">${esc(error)}</div>`;
  const wait = '<div class="pn pad"><p class="muted">Conectando con el coche…</p></div>';
  if (tab === 'ajustes') html += viewAjustes();
  else if (tab === 'estado') html += live ? viewEstado(live) : error ? '' : wait;
  else if (tab === 'motor') html += live ? viewMotor(live) : error ? '' : wait;
  else if (tab === 'viajes') html += viewViajes();
  else if (tab === 'datos') html += viewDatos();
  else if (tab === 'taller') html += viewTaller();
  const main = $('#main');
  main.classList.toggle('anim', animate);
  main.innerHTML = html;
  if (animate) countUp();
  animate = false;
  $('#sheetHost').innerHTML = sheet ? `<div class="sheet-bg" id="sheetBg">${sheetHtml()}</div>` : '';
  afterRender();
}

function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count; if (!isFinite(to)) return;
    const t0 = performance.now(), D = 900;
    const step = now => { const p = Math.min(1, (now - t0) / D); el.textContent = nf(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function afterRender() {
  const ph = $('#parkMapHost');
  if (ph && live && live.location) {
    const m = mapIn('park', ph, { mini: true });
    if (m) { const ll = [live.location.lat, live.location.lon]; m.layer.clearLayers(); dot(ll, C.ac, 6).addTo(m.layer); m.fit = () => m.map.setView(ll, 15); m.fit(); }
  }
  const th = $('#tripMapHost');
  if (th && tripDetail) {
    const m = mapIn('trip', th, { fresh: true });
    if (m) {
      m.layer.clearLayers();
      const p = tripDetail.points;
      for (let i = 0; i < p.length - 1; i++) L.polyline([[p[i][0], p[i][1]], [p[i + 1][0], p[i + 1][1]]], { color: speedCol(p[i][2]), weight: 5, opacity: .95, lineCap: 'round' }).addTo(m.layer);
      if (p.length) {
        dot([p[0][0], p[0][1]], C.ok).addTo(m.layer);
        dot([p[p.length - 1][0], p[p.length - 1][1]], '#f4f5f6').addTo(m.layer);
        const b = L.latLngBounds(p.map(q => [q[0], q[1]]));
        m.fit = () => b.isValid() && !b.getNorthEast().equals(b.getSouthWest()) ? m.map.fitBounds(b, { padding: [28, 28], maxZoom: 16 }) : m.map.setView([p[0][0], p[0][1]], 15);
        m.fit();
      }
    }
  }
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('[data-trip]').forEach(b => b.onclick = async () => {
    try { tripDetail = await api('/api/trips/' + b.dataset.trip); error = null; } catch (e) { error = e.message; }
    if (tab !== 'viajes') { tab = 'viajes'; history.replaceState(null, '', '#viajes'); }
    animate = true; render(); $('#main').scrollTop = 0;
  });
  const back = $('#backTrips'); if (back) back.onclick = () => { tripDetail = null; animate = true; render(); };
  document.querySelectorAll('[data-refuel]').forEach(b => b.onclick = () => { sheet = { type: 'refuel', item: refuels.refuels.find(r => String(r.ts) === b.dataset.refuel) }; render(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { sheet = { type: 'maint', item: b.dataset.edit === 'new' ? null : maint.items.find(i => String(i.id) === b.dataset.edit) }; render(); });
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { maint = await api(`/api/maintenance/${b.dataset.done}/done`, { method: 'POST' }); loaded.maint = Date.now(); flash('Apuntado con los km de hoy'); }
    catch (e) { error = e.message; render(); }
  });
  document.querySelectorAll('[data-fuel]').forEach(b => b.onclick = () => { cfg.fuel = b.dataset.fuel; saveCfg(); fuel = null; loaded.fuel = 0; render(); });
  const csv = $('#copyCsv'); if (csv) csv.onclick = copyCsv;
  const pb = $('#parkBtn'); if (pb && live && live.ignition === 'off') pb.onclick = async () => {
    if (!parking) { try { parking = await api('/api/parking'); } catch (e) { error = e.message; render(); return; } }
    sheet = { type: 'parking' }; render();
  };
  document.querySelectorAll('[data-tyreset]').forEach(b => b.onclick = () => { sheet = { type: 'tyreset' }; render(); });
  document.querySelectorAll('[data-tyrerot]').forEach(b => b.onclick = async () => {
    try { tyreSet = await api('/api/tyreset', { method: 'POST', body: JSON.stringify({ rotated: true }) }); flash('Rotación apuntada'); render(); } catch (e) { error = e.message; render(); }
  });
  document.querySelectorAll('[data-deadline]').forEach(b => b.onclick = () => { sheet = { type: 'deadline', item: b.dataset.deadline === 'new' ? null : deadlines.find(d => d.id === b.dataset.deadline) }; render(); });
  document.querySelectorAll('[data-tracknote]').forEach(b => b.onclick = () => { sheet = { type: 'tracknote', item: trackdays[+b.dataset.tracknote] }; render(); });
  document.querySelectorAll('[data-track]').forEach(b => b.onclick = async () => {
    const v = b.dataset.track;
    try {
      await api('/api/track', { method: 'POST', body: JSON.stringify(v === 'off' ? { until: null } : v === 'midnight' ? { until: 'midnight' } : { hours: +v }) });
      flash(v === 'off' ? 'Modo circuito desactivado' : 'Modo circuito activado');
      loadLive();
    } catch (e) { error = e.message; render(); }
  });
  const ac = $('#addCircuit'); if (ac) ac.onclick = async () => {
    const name = prompt('Nombre del circuito (se guarda la ubicación actual del coche):');
    if (!name) return;
    try {
      const r = await api('/api/circuits/custom', { method: 'POST', body: JSON.stringify({ name }) });
      if (r.error) throw new Error(r.error);
      customCircuits = r.custom; flash('Circuito guardado: se detectará solo a partir de ahora'); loadLive();
    } catch (e) { error = e.message; render(); }
  };
  document.querySelectorAll('[data-delcircuit]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Quitar este circuito?')) return;
    try { customCircuits = (await api('/api/circuits/custom/' + encodeURIComponent(b.dataset.delcircuit), { method: 'DELETE' })).custom; render(); loadLive(); }
    catch (e) { error = e.message; render(); }
  });
  const rc = $('#refreshCar'); if (rc) rc.onclick = async () => {
    rc.disabled = true; rc.textContent = 'Pidiendo…';
    try {
      const r = await api('/api/ford/refresh', { method: 'POST' });
      if (!r.ok) throw new Error(r.error);
      flash('Pedido al coche. Los datos nuevos tardan en llegar entre 30 s y 2 min.');
      [30e3, 60e3, 120e3].forEach(ms => setTimeout(loadLive, ms));
    } catch (e) { error = e.message; render(); }
  };
  const db = $('#driveBtn'); if (db) db.onclick = () => { driveForced = true; renderDrive(); };
  bindSettings(); bindSheet();
}

function saveCfg() { try { localStorage.setItem('fst_cfg', JSON.stringify(cfg)); } catch (e) {} }

function bindSettings() {
  const form = $('#cfgForm');
  if (form) form.onsubmit = e => {
    e.preventDefault();
    cfg.url = $('#fUrl').value.trim(); cfg.key = $('#fKey').value; saveCfg();
    live = hist = battery = refuels = trips = records = maint = tripDetail = fuel = null; loaded = {}; error = null;
    go('estado'); loadLive();
  };
  const cancel = $('#cancelCfg'); if (cancel) cancel.onclick = () => go('estado');
  const saveGuard = async () => {
    try {
      guard = await api('/api/guard', { method: 'POST', body: JSON.stringify({ enabled: $('#gEnabled').checked, night: $('#gNight').checked, from: $('#gFrom').value, to: $('#gTo').value }) });
      loaded.guard = Date.now(); flash('Vigilancia guardada');
    } catch (e) { error = e.message; render(); }
  };
  const cw = $('#copyWidget'); if (cw) cw.onclick = async () => {
    try {
      // Safari solo deja copiar dentro del toque: se le pasa la descarga como promesa.
      const blob = fetch('herramientas/widget-scriptable.js', { cache: 'no-store' }).then(r => r.text()).then(t => new Blob([t], { type: 'text/plain' }));
      if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ 'text/plain': blob })]);
      else await navigator.clipboard.writeText(await (await blob).text());
      flash('Código copiado. Pégalo en Scriptable.');
    } catch (e) { error = 'No se pudo copiar: ' + e.message; render(); }
  };
  const ts = $('#tSave'); if (ts) ts.onclick = async () => {
    try {
      tyrePrefs = await api('/api/tyres', { method: 'POST', body: JSON.stringify({ front: $('#tFront').value, rear: $('#tRear').value }) });
      flash('Presiones guardadas'); live = null; loadLive();
    } catch (e) { error = e.message; render(); }
  };
  ['#gEnabled', '#gNight', '#gFrom', '#gTo'].forEach(id => { const el = $(id); if (el) el.onchange = saveGuard; });
  const bk = $('#backupBtn'); if (bk) bk.onclick = async () => {
    bk.disabled = true; bk.textContent = 'Preparando…';
    try {
      const data = await api('/api/export');
      const name = `fiesta-st-copia-${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
      flash('Copia lista: ' + nf(data.snapshots.length) + ' registros y ' + nf(data.trips.length) + ' trayectos');
    } catch (e) { if (e.name !== 'AbortError') { error = e.message; render(); } else { bk.disabled = false; bk.textContent = 'Descargar copia'; } }
  };
  const on = $('#pushOn'); if (on) on.onclick = async () => {
    on.disabled = true;
    try { await enablePush(); flash('Avisos activados en este móvil'); } catch (e) { error = e.message; render(); }
  };
  const test = $('#pushTest'); if (test) test.onclick = async () => {
    test.disabled = true;
    try {
      const r = await api('/api/push/test', { method: 'POST' });
      if (!r.devices) throw new Error('Todavía no hay ningún móvil con los avisos activados.');
      flash(r.sent ? 'Aviso de prueba enviado' : 'No se pudo enviar el aviso. Prueba a activarlos de nuevo.');
    } catch (e) { error = e.message; render(); }
  };
}

function bindSheet() {
  const bg = $('#sheetBg'); if (!bg) return;
  bg.onclick = e => { if (e.target === bg) closeSheet(); };
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  const form = $('#sheetForm');
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      if (sheet.type === 'tyreset') {
        tyreSet = await api('/api/tyreset', { method: 'POST', body: JSON.stringify({ model: $('#tyModel').value, size: $('#tySize').value, mounted_date: $('#tyDate').value, mounted_km: $('#tyKm').value }) });
        sheet = null; flash('Neumáticos guardados');
      } else if (sheet.type === 'deadline') {
        deadlines = (await api('/api/deadlines', { method: 'POST', body: JSON.stringify({ id: sheet.item && sheet.item.id, name: $('#dName').value, date: $('#dDate').value }) })).items;
        sheet = null; flash('Fecha guardada');
      } else if (sheet.type === 'tracknote') {
        await api('/api/trackdays/note', { method: 'POST', body: JSON.stringify({ day: sheet.item.day, circuit: sheet.item.circuit, note: $('#tnNote').value }) });
        trackdays = (await api('/api/trackdays')).days; sheet = null; flash('Notas guardadas');
      } else if (sheet.type === 'parking') {
        parking = await api('/api/parking', { method: 'POST', body: JSON.stringify({ note: $('#pNote').value.trim() }) });
        sheet = null; flash('Nota guardada');
      } else if (sheet.type === 'refuel') {
        const price = $('#sPrice').value.trim();
        await api('/api/refuels/' + sheet.item.ts, { method: 'POST', body: JSON.stringify({ price_total: price ? num(price) : null, station: $('#sStation').value.trim() }) });
        refuels = await api('/api/refuels'); loaded.datos = Date.now();
        sheet = null; flash('Repostaje guardado');
      } else {
        const body = { id: sheet.item && sheet.item.id, name: $('#mName').value, interval_km: num($('#mKm').value), interval_months: num($('#mMo').value),
          last_km: num($('#mLastKm').value), last_date: $('#mLastDate').value, notes: $('#mNotes').value };
        maint = await api('/api/maintenance', { method: 'POST', body: JSON.stringify(body) }); loaded.maint = Date.now();
        sheet = null; flash('Tarea guardada');
      }
    } catch (err) {
      btn.disabled = false;
      let m = form.querySelector('.err');
      if (!m) { m = document.createElement('div'); m.className = 'err'; form.prepend(m); }
      m.textContent = err.message;
    }
  };
  form.querySelectorAll('[data-min]').forEach(b => b.onclick = async () => {
    try {
      parking = await api('/api/parking', { method: 'POST', body: JSON.stringify({ minutes: +b.dataset.min }) });
      sheet = null; flash(+b.dataset.min ? `Te aviso 10 minutos antes de que pasen ${b.textContent.trim()}` : 'Temporizador quitado');
    } catch (e) { error = e.message; sheet = null; render(); }
  });
  const dd = $('#dDelete'); if (dd) dd.onclick = async () => {
    try { deadlines = (await api('/api/deadlines/' + encodeURIComponent(sheet.item.id), { method: 'DELETE' })).items; sheet = null; flash('Fecha quitada'); }
    catch (e) { error = e.message; sheet = null; render(); }
  };
  const del = $('#mDelete'); if (del) del.onclick = async () => {
    if (del.dataset.confirm !== '1') { del.dataset.confirm = '1'; del.textContent = 'Toca otra vez para borrar'; return; }
    try { maint = await api('/api/maintenance/' + sheet.item.id, { method: 'DELETE' }); sheet = null; flash('Tarea borrada'); }
    catch (e) { error = e.message; sheet = null; render(); }
  };
}
function closeSheet() { sheet = null; render(); }
function flash(msg) { notice = msg; error = null; render(); setTimeout(() => { if (notice === msg) { notice = null; if (!sheet) render(); } }, 2500); }

async function copyCsv() {
  const lines = [['fecha', 'km', 'litros', 'precio_total_eur', 'eur_litro', 'consumo_l100km', 'gasolinera', 'precio_estimado'].join(';')];
  for (const r of refuels.refuels.slice().reverse()) lines.push([new Date(r.ts).toISOString().slice(0, 10), Math.round(r.odometer), nf(r.litres, 1),
    r.price_total != null ? nf(r.price_total, 2) : '', r.price_l != null ? nf(r.price_l, 3) : '', r.l100 != null ? nf(r.l100, 1) : '', r.station || '', r.price_auto ? 'sí' : ''].join(';'));
  try { await navigator.clipboard.writeText(lines.join('\n')); flash('CSV copiado: pégalo en tu Cuaderno o en una hoja de cálculo'); }
  catch (e) { error = 'No se pudo copiar al portapapeles.'; render(); }
}

// ---------- Avisos push ----------
function b64ToU8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined')
    throw new Error('Este navegador no admite avisos. En iPhone, abre la app desde el icono de la pantalla de inicio.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('No has dado permiso. Puedes activarlo en Ajustes del iPhone → Notificaciones → Fiesta ST.');
  const reg = await navigator.serviceWorker.ready;
  const { key } = await api('/api/push/key');
  let sub = await reg.pushManager.getSubscription();
  if (sub) {
    const cur = sub.options && sub.options.applicationServerKey;
    if (cur && btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') !== key) { await sub.unsubscribe(); sub = null; }
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
  await api('/api/push/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) });
}

// ---------- Navegación ----------
function go(t) {
  tab = t; sheet = null; animate = true;
  if (t !== 'viajes') tripDetail = null;
  if (TABS.includes(t) && location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  render();
  if (t === 'ajustes') { clearTimeout(timer); if (cfg.url) loadFor('ajustes'); } else { loadFor(t); schedule(); }
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'viajes' && tab === 'viajes') tripDetail = null;
  go(b.dataset.tab);
});
$('#cfgBtn').onclick = () => go('ajustes');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) go(h); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && cfg.url && tab !== 'ajustes') { loadLive(); loadFor(tab, true); } else clearTimeout(timer);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
// Alto real de la pantalla: iOS en modo app (icono) a veces informa de menos alto y deja la parte de abajo cortada.
function fitScreen() {
  const portrait = window.matchMedia('(orientation: portrait)').matches;
  // iOS 26 en modo app solo pinta hasta innerHeight (el resto queda en negro): la app ocupa justo eso
  // y, si sobra la franja de abajo, la barra no necesita el margen de la raya de inicio.
  const h = window.innerHeight;
  const full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
  document.documentElement.classList.toggle('vpshort', standalone && full - h > 30);
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitScreen();
['resize', 'orientationchange', 'pageshow', 'focus'].forEach(ev => window.addEventListener(ev, () => { fitScreen(); setTimeout(fitScreen, 300); }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(fitScreen, 100); });
setTimeout(fitScreen, 100); setTimeout(fitScreen, 800);


render();
if (cfg.url && cfg.key) {
  loadLive(); loadFor(tab);
  if (tab !== 'datos') api('/api/refuels').then(r => { refuels = r; if (tab === 'estado' && !sheet) render(); }).catch(() => {});
}
